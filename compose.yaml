services:
 postgres:
  image: postgres:16
  environment:
   POSTGRES_DB: delivery
   POSTGRES_USER: delivery
   POSTGRES_PASSWORD: delivery
  ports: ["5432:5432"]
  volumes: ["delivery-data:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U delivery"]
   interval: 5s
   timeout: 3s
   retries: 10
 api:
  build: .
  environment:
   DATABASE_URL: jdbc:postgresql://postgres:5432/delivery
   DATABASE_USER: delivery
   DATABASE_PASSWORD: delivery
  ports: ["8080:8080"]
  depends_on:
   postgres: {condition: service_healthy}
volumes:
 delivery-data:

